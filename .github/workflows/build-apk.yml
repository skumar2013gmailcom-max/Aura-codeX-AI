name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Isse aap manual button daba kar bhi APK build kar sakte ho

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: GitHub repository se code checkout karna
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Java 17 set up karna (Aapke project ke target configuration ke hisab se)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Gradle wrapper ko execute permission dena
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Step 4: Debug APK build karna
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Step 5: Banayi hui APK file ko GitHub Artifacts par upload karna (Download karne ke liye)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dost-AI-App-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
